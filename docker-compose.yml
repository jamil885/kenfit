services:

  postgres:
    image: postgres:17
    container_name: kenfit-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: kenfit
      POSTGRES_USER: kenfit
      POSTGRES_PASSWORD: change_me

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kenfit -d kenfit"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  postgres_data: