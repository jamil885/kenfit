[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"app/models/__init__.py" = ["F401"]
"alembic/env.py" = ["F401"]
"app/app/main.py" = ["F401"]
